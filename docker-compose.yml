# سروا — کل استک.
#
# هدف این فایل یک جمله است: روی سرور بعدی، `docker compose up -d` تنها کاری
# باشد که لازم است. پس هیچ مقداری اینجا هاردکد نشده و همه از .env می‌آید،
# و مهاجرت دیتابیس هم داخل entrypoint اپ است نه یک مرحلهٔ دستی.

name: sarva

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER لازم است}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB لازم است}
      # وگرنه initdb با لوکیل سیستم بالا می‌آید و مرتب‌سازیِ متن فارسی بین
      # ماشین‌ها فرق می‌کند — یعنی همان کوئری روی سرور و لپ‌تاپ ترتیب متفاوت
      # می‌دهد. با C.UTF-8 رفتار همه‌جا یکی است.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # فقط روی لوپ‌بک، و فقط برای وصل شدن با یک کلاینت گرافیکی. روی سرورِ
    # عمومی این خط را از .env خالی بگذارید تا اصلاً منتشر نشود.
    ports:
      - "${POSTGRES_EXPOSE:-127.0.0.1:5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # نه فقط «شروع شده» — پستگرس چند ثانیه بعد از start تازه آمادهٔ اتصال
        # می‌شود، و migration ای که زودتر بزند با ECONNREFUSED می‌میرد.
        condition: service_healthy
    env_file:
      - .env
    environment:
      # داخل شبکهٔ compose، هاستِ دیتابیس نام سرویس است. این تنها جایی است که
      # DATABASE_URL ساخته می‌شود تا در .env تکرار نشود و از هم نیفتند.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOADS_DIR: /app/uploads
    volumes:
      # فایل‌های آپلودی باید از بازسازی کانتینر جان سالم به در ببرند. همین
      # volume با :ro به caddy هم داده می‌شود تا مستقیم سروشان کند.
      - uploads:/app/uploads
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      # گواهی‌های TLS. بدون این volume، هر بار restart یک گواهی تازه از
      # Let's Encrypt گرفته می‌شود و خیلی زود به سقف نرخ می‌خورید.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
