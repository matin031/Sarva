# سروا — کل استک.
#
# هدف این فایل یک جمله است: روی سرور بعدی، `docker compose up -d` تنها کاری
# باشد که لازم است. پس هیچ مقداری اینجا هاردکد نشده و همه از .env می‌آید،
# و مهاجرت دیتابیس هم داخل entrypoint اپ است نه یک مرحلهٔ دستی.

name: sarva

# چرخش لاگ — یک بار تعریف، سه بار استفاده.
#
# ⚠️ چرا لازم است: درایور پیش‌فرض داکر `json-file` **بدون سقف** است. یعنی
# لاگِ یک سرویسِ پرحرف تا وقتی دیسک پر شود بزرگ می‌شود، و آن‌وقت دیتابیس هم
# دیگر جایی برای نوشتن ندارد. این اتفاق ماه‌ها بعد از راه‌اندازی می‌افتد،
# درست وقتی کسی به آن فکر نمی‌کند.
#
# json-file نگه داشته شده و درایور دیگری انتخاب نشده، چون `docker compose logs`
# فقط با همین (و local) کار می‌کند — و آن دستور تنها راهِ دیدنِ لاگ برای کسی
# است که با سرور کار نمی‌کند.
#
# ۱۰ مگابایت × ۵ فایل = حداکثر ۵۰ مگابایت به ازای هر سرویس.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # ⚠️ mysql و نه mariadb. این دو سازگارِ کامل نیستند و اسکیمای ما دست‌کم
    # سه چیز دارد که روی MariaDB یا نیست یا فرق می‌کند: نمایهٔ چندمقداریِ
    # `CAST(tags AS CHAR(64) ARRAY)`، ستون JSON واقعی (در MariaDB یک
    # LONGTEXT با قید است)، و collation های utf8mb4_0900_*.
    #
    # ⚠️ 8.4 و نه 8.0: پشتیبانی 8.0 در آوریل ۲۰۲۶ تمام شده و امروز از آن
    # گذشته‌ایم. 8.4 نسخهٔ LTS است.
    #
    # صادقانه: آزمون‌های این مهاجرت روی MySQL 8.0.46 اجرا شده‌اند، چون در
    # محیط توسعه دسترسی به مخزن اوراکل نبود. تفاوت‌های 8.0 → 8.4 که به این
    # پروژه می‌خورند بررسی شده‌اند و هیچ‌کدام مانع نیستند (جزئیات و فهرست
    # پس از ارتقا db:check و db:check-sql را دوباره اجرا کنید).
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    command:
      # ⚠️ این‌ها پیش‌فرضِ MySQL 8 هم هستند، ولی صریح نوشته شده‌اند چون
      # پیش‌فرض چیزی است که می‌تواند در نسخهٔ بعد عوض شود، و هر سه اگر عوض
      # شوند داده را *بی‌صدا* خراب می‌کنند نه با خطا.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # بدون STRICT_TRANS_TABLES، رشتهٔ بلندتر از ستون بریده می‌شود و تاریخِ
      # نامعتبر صفر می‌شود — هر دو فقط با یک warning که کسی نمی‌بیند.
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      # زمانِ ذخیره‌شده همیشه UTC است؛ تبدیل به وقت تهران در کوئری انجام
      # می‌شود. اگر منطقهٔ سرور چیز دیگری باشد، NOW() جابه‌جا می‌شود.
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE لازم است}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER لازم است}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD لازم است}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD لازم است}
      # ⚠️ MYSQL_INITDB_SKIP_TZINFO عمداً تنظیم *نشده* است.
      #
      # ایمیج رسمی هنگام مقداردهیِ اولیه جدول‌های mysql.time_zone را پر
      # می‌کند، مگر این متغیر ست باشد. پنل مدیریت برای گروه‌بندی روزانه از
      # CONVERT_TZ(…, '+00:00', 'Asia/Tehran') استفاده می‌کند و آن تابع اگر
      # نام منطقه را نشناسد **خطا نمی‌دهد؛ NULL برمی‌گرداند**. یعنی همهٔ
      # نمودارهای روزانه بی‌صدا خالی می‌شوند.
      #
      # این تنها جایی است که آن جدول‌ها پر می‌شوند، و فقط یک بار — در
      # مقداردهیِ اولیهٔ volume. اگر بعداً لازم شد، دستورش در
      # README پروژه هست.
    volumes:
      # ⚠️ نامِ تازه و نه استفادهٔ دوباره از pgdata.
      #
      # اگر همان volume می‌ماند، MySQL روی دایرکتوریِ دادهٔ پستگرس بالا
      # می‌آمد و یا می‌مرد یا (بدتر) کنارش می‌نشست. حجمِ قدیمی دست‌نخورده
      # می‌ماند تا اگر لازم شد بشود به پستگرس برگشت.
      - mysqldata:/var/lib/mysql
    # فقط روی لوپ‌بک، و فقط برای وصل شدن با یک کلاینت گرافیکی. روی سرورِ
    # عمومی این خط را از .env خالی بگذارید تا اصلاً منتشر نشود.
    ports:
      - "${MYSQL_EXPOSE:-127.0.0.1:3306}:3306"
    healthcheck:
      # ⚠️ mysqladmin ping روی TCP و نه سوکت.
      #
      # هنگام مقداردهیِ اولیه، ایمیج یک سرورِ موقت روی سوکتِ یونیکس بالا
      # می‌آورد که هنوز کاربر و دیتابیس ندارد. ping روی سوکت به آن جواب
      # می‌دهد و compose خیال می‌کند دیتابیس آماده است — بعد کانتینر اپ
      # migration می‌زند و وسطِ کار سرورِ موقت خاموش می‌شود. آن سرورِ موقت
      # با --skip-networking بالا می‌آید، پس ۱۲۷.۰.۰.۱ همان چیزی است که
      # فرقشان را می‌گذارد.
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
          "--silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      # InnoDB در اولین بالا آمدن فایل‌های redo و undo را می‌سازد و این روی
      # دیسکِ کند بیشتر از ۱۰ ثانیه طول می‌کشد.
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # لاگ ساختاریافتهٔ اپ فقط به stdout/stderr می‌رود (هیچ فایلی داخل کانتینر
    # ساخته نمی‌شود)، پس چرخش کارِ همین چند خط است.
    logging: *default-logging
    depends_on:
      db:
        # نه فقط «شروع شده» — MySQL چند ده ثانیه بعد از start تازه آمادهٔ
        # اتصال می‌شود، و migration ای که زودتر بزند با ECONNREFUSED می‌میرد.
        condition: service_healthy
    env_file:
      - .env
    environment:
      # داخل شبکهٔ compose، هاستِ دیتابیس نام سرویس است. این تنها جایی است که
      # DATABASE_URL ساخته می‌شود تا در .env تکرار نشود و از هم نیفتند.
      #
      # ⚠️ گذرواژه باید در .env به شکل URL-encoded باشد اگر نویسهٔ ویژه دارد
      # (@ : / ? # و فاصله). .env.example توضیحش داده.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      UPLOADS_DIR: /app/uploads
      # خروجی لاگ در کانتینر همیشه JSON است، حتی اگر NODE_ENV جور دیگری تنظیم
      # شود — یک خط JSON با grep و jq قابل کار است، متنِ رنگی نه.
      LOG_FORMAT: json
    volumes:
      # فایل‌های آپلودی باید از بازسازی کانتینر جان سالم به در ببرند. همین
      # volume با :ro به caddy هم داده می‌شود تا مستقیم سروشان کند.
      - uploads:/app/uploads
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      # گواهی‌های TLS. بدون این volume، هر بار restart یک گواهی تازه از
      # Let's Encrypt گرفته می‌شود و خیلی زود به سقف نرخ می‌خورید.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # ⚠️ pgdata عمداً حذف *نشده*.
  #
  # تا وقتی مهاجرت روی سرور واقعی انجام و راستی‌آزمایی نشده، آن حجم تنها
  # نسخهٔ زندهٔ داده است. `docker compose down -v` هر دو را می‌برد؛ برای
  # پاک کردنِ آگاهانه‌اش دستورش در runbook هست.
  pgdata:
  mysqldata:
  uploads:
  caddy_data:
  caddy_config:
