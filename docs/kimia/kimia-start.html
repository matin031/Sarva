<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کیمیای وزن — صفحهٔ شروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ---- tokens: replace with the site's real tokens ---- */
:root{
  --bg:#060a13; --dots:rgba(160,200,255,.10); --panel:#0c1526; --edge:rgba(150,190,255,.14);
  --ink:#e9eff9; --mute:#93a2bb; --acc:#22d3c5; --acc-ink:#03302d; --sel:rgba(34,211,197,.10);
  --card1:#0f1c33; --card2:#0a1222; --ledge1:#1b2b46; --ledge2:#0e1830; --dash:rgba(255,255,255,.18);
  --glass-edge:rgba(255,255,255,.30); --glass-fill:rgba(255,255,255,.05); --liq-op:.62;
  --gw:34px; --gh:84px; --cw:52px;
}
:root[data-theme="light"]{
  --bg:#f3f1ed; --dots:rgba(20,40,70,.09); --panel:#fff; --edge:rgba(20,40,70,.13);
  --ink:#0f1d2b; --mute:#56657a; --acc:#0d9488; --acc-ink:#fff; --sel:rgba(13,148,136,.09);
  --card1:#ffffff; --card2:#f7f8fa; --ledge1:#e9edf3; --ledge2:#d9e0ea; --dash:rgba(20,40,70,.22);
  --glass-edge:rgba(20,40,70,.32); --glass-fill:rgba(20,40,70,.04); --liq-op:.55;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); font-family:'Vazirmatn',system-ui,sans-serif;
  background:
    radial-gradient(var(--dots) 1px,transparent 1.6px) 0 0/46px 46px,
    radial-gradient(var(--dots) 1px,transparent 1.6px) 23px 23px/46px 46px,
    var(--bg);
  transition:background-color .3s,color .3s;
}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--acc); outline-offset:3px}

/* ---- site chrome (header + breadcrumb) ---- */
.head{max-width:1120px; margin:0 auto; padding:22px 20px 0; display:flex; justify-content:space-between; align-items:center}
.logo{display:flex; align-items:center; gap:10px; font-size:30px; font-weight:800; color:var(--acc); text-decoration:none}
.logo svg{width:34px; height:34px}
.tools{display:flex; gap:10px}
.chip{height:48px; min-width:48px; padding:0 18px; border-radius:14px; border:1px solid var(--edge); background:var(--panel); cursor:pointer; display:grid; place-items:center; font-weight:600}
.chip svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.crumb{max-width:1120px; margin:20px auto 0; padding:0 20px}
.crumb a{display:inline-flex; gap:8px; align-items:center; color:var(--mute); text-decoration:none; font-size:14px; padding:10px 16px; border:1px solid var(--edge); border-radius:14px; background:var(--panel)}

/* ---- layout ---- */
main{max-width:1120px; margin:0 auto; padding:24px 20px 60px; display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:56px; align-items:center; min-height:calc(100vh - 170px)}
.intro h1{margin:0; font-size:clamp(40px,5vw,56px); font-weight:800; line-height:1.25}
.intro p{margin:14px 0 0; color:var(--mute); font-size:17px; line-height:1.9}
.setup{margin-top:30px}
.setup h2{margin:0 0 10px; font-size:14px; font-weight:600; color:var(--mute)}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.opt{position:relative}
.opt input{position:absolute; inset:0; opacity:0; cursor:pointer}
.opt span{display:block; padding:14px 8px 12px; text-align:center; border-radius:16px; border:1px solid var(--edge); background:var(--panel); transition:border-color .2s,background .2s,transform .2s}
.opt b{display:block; font-size:26px; font-weight:800; line-height:1.3}
.opt small{display:block; color:var(--mute); font-size:12.5px}
.opt input:hover+span{transform:translateY(-2px)}
.opt input:checked+span{border-color:var(--acc); background:var(--sel); box-shadow:0 0 0 1px var(--acc) inset}
.opt input:focus-visible+span{outline:2px solid var(--acc); outline-offset:3px}
.start{margin-top:16px; width:100%; height:56px; border:0; border-radius:16px; cursor:pointer; font-weight:800; font-size:17px; color:var(--acc-ink); background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc)); box-shadow:0 12px 28px -12px var(--acc); transition:transform .2s,filter .2s}
.start:hover{filter:brightness(1.06); transform:translateY(-1px)}
.start:active{transform:translateY(1px)}
.note{margin:14px 0 0; display:flex; gap:8px; align-items:flex-start; line-height:1.7; color:var(--mute); font-size:13.5px}
.note svg{width:16px; height:16px; flex:none; margin-top:4px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* ---- live preview stage (same components as the real game) ---- */
.stage{position:relative; width:min(560px,100%); margin:0 auto; padding-top:78px; pointer-events:none; user-select:none}
.card{position:relative; border-radius:22px; border:1px solid var(--edge); background:linear-gradient(180deg,var(--card1),var(--card2)); margin-bottom:44px; box-shadow:0 30px 60px -40px rgba(0,0,0,.5)}
.vessel{position:absolute; inset:0; border-radius:inherit; overflow:hidden}
.fill{position:absolute; left:-18px; right:-18px; bottom:-18px; padding-bottom:18px; display:flex; flex-direction:column-reverse; filter:blur(7px) saturate(1.15); opacity:var(--liq-op); transition:filter 1.8s ease,opacity .8s}
.band{flex:none; height:0; background:var(--c)}
.wave{position:absolute; left:0; width:100%; height:18px; bottom:-40px; overflow:hidden; opacity:0; color:#fff; transition:opacity .4s,color 1.6s}
.wave svg{position:absolute; left:0; top:0; width:200%; height:100%; animation:slosh 5s linear infinite}
.wave path{fill:currentColor; opacity:.7}
@keyframes slosh{to{transform:translateX(-50%)}}
.verse{position:relative; z-index:2; padding:28px 24px 46px; text-align:center; font-size:clamp(17px,2.2vw,21px); line-height:2.1; font-weight:600}
.verse p{margin:0}
:root[data-theme="dark"] .verse{text-shadow:0 2px 12px rgba(0,0,0,.6)}
.ring{position:absolute; inset:0; width:100%; height:100%; z-index:3; overflow:visible}
.ring path{fill:none; stroke-width:2.5; stroke-linecap:round}
.track{stroke:var(--edge)}
.prog{stroke:var(--acc); stroke-dasharray:1 1; stroke-dashoffset:1; opacity:0; filter:drop-shadow(0 0 4px var(--acc))}
.play{position:absolute; z-index:6; left:50%; bottom:-26px; translate:-50% 0; width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc)); box-shadow:0 0 0 6px var(--bg),0 8px 22px -6px var(--acc)}
.play svg{width:20px; height:20px; fill:var(--acc-ink)}

.rack{display:flex; gap:10px; justify-content:center; padding:20px 20px 12px; margin:0 auto; width:fit-content; border-radius:24px; border:1px solid var(--edge); background:var(--panel); position:relative}
.slot{position:relative; width:var(--cw); height:calc(var(--gh) + 14px)}
.slot::before{content:''; position:absolute; left:calc((var(--cw) - var(--gw))/2); top:0; width:var(--gw); height:var(--gh); border:1.5px dashed var(--dash); border-radius:6px 6px 20px 20px; transition:opacity .3s}
.slot.full::before{opacity:0}
.slot::after{content:''; position:absolute; left:0; right:0; top:calc(var(--gh) - 12px); height:18px; z-index:4; border-radius:0 0 12px 12px; border:1px solid var(--edge); background:linear-gradient(180deg,var(--ledge1),var(--ledge2)); transition:opacity .25s,box-shadow .5s}
.slot.full::after{box-shadow:0 8px 20px -6px var(--c)}
.slot.lift::after{opacity:0}
.pool{display:flex; justify-content:center; gap:0; margin-top:26px}
.cell{position:relative; width:var(--cw); height:calc(var(--gh) + 6px)}
.lift{z-index:50}

.tube{position:relative; z-index:1; display:block; width:var(--cw); padding:0; border:0; background:none; transform-origin:calc(var(--cw)/2) 0}
.gw{position:relative; width:var(--gw); height:var(--gh); margin:0 auto}
.glass{position:absolute; inset:0; overflow:hidden; border-radius:3px 3px 20px 20px; border:1.5px solid var(--glass-edge); border-top:0; background:var(--glass-fill)}
.liq{position:absolute; left:50%; top:50%; width:400px; height:400px; margin-left:-200px; transform-origin:200px 0;
  background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 35%,rgba(0,0,0,.2)),var(--c)}
.liq::before{content:''; position:absolute; left:0; right:0; top:0; height:4px; background:rgba(255,255,255,.35)}
.shine{position:absolute; left:6px; top:6px; bottom:18px; width:4px; border-radius:4px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.rim{position:absolute; left:-3px; right:-3px; top:-3px; height:5px; border-radius:4px; background:var(--glass-edge)}
.lbl{display:none}

.fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:80}

@media (max-width:920px){
  main{grid-template-columns:1fr; gap:36px; min-height:0}
  .intro{order:1} .stage{order:2}
}
@media (prefers-reduced-motion:reduce){ .wave svg{animation:none} .start,.opt span{transition:none} }
</style>
</head>
<body>

<header class="head">
  <a class="logo" href="#" aria-label="سروا">
    <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3c4 4 6 8 6 13a6 6 0 0 1-12 0c0-5 2-9 6-13z"/><path d="M17 12v18M9 30h16"/></svg>
    سروا
  </a>
  <div class="tools">
    <button class="chip" id="theme" aria-label="تغییر حالت روشن و تیره">
      <svg id="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="ic-moon" viewBox="0 0 24 24" style="display:none"><path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a6.8 6.8 0 0 0 10.2 10.2z"/></svg>
    </button>
    <button class="chip" aria-label="تنظیم رنگ‌ها"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.3 0 2-.9 2-2 0-1.5-1-1.8-1-3 0-1 .8-2 2-2h2a4 4 0 0 0 4-4c0-4-4-7-9-7z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15.5" cy="7.5" r="1"/></svg></button>
    <button class="chip">ورود</button>
  </div>
</header>

<nav class="crumb"><a href="#">← بازی‌ها</a></nav>

<main>
  <section class="intro">
    <h1>کیمیای وزن</h1>
    <p>ریتم بیت را بشنو، ارکان را در جایگاه‌ها بچین و رنگ‌ها را در بیت بریز. ترکیب درست، وزن را پایدار نگه می‌دارد.</p>

    <form class="setup" id="setup">
      <h2 id="lbl-n">چند بیت؟</h2>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-n">
        <label class="opt"><input type="radio" name="n" value="5"><span><b>۵</b>کوتاه<small>حدود ۴ دقیقه</small></span></label>
        <label class="opt"><input type="radio" name="n" value="10" checked><span><b>۱۰</b>معمولی<small>حدود ۸ دقیقه</small></span></label>
        <label class="opt"><input type="radio" name="n" value="15"><span><b>۱۵</b>بلند<small>حدود ۱۲ دقیقه</small></span></label>
      </div>
      <button class="start" type="submit">شروع بازی</button>
      <p class="note">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        صدا را روشن بگذار. ریتم هر بیت سرنخ اصلی سؤال است.
      </p>
    </form>
  </section>

  <!-- live preview of the real game (decorative) -->
  <section class="stage" aria-hidden="true">
    <div class="card" id="card">
      <div class="vessel"><div class="fill" id="fill"></div>
        <div class="wave" id="wave"><svg viewBox="0 0 400 18" preserveAspectRatio="none"><path d="M0 9 Q25 1 50 9 T100 9 T150 9 T200 9 T250 9 T300 9 T350 9 T400 9 V18 H0Z"/></svg></div>
      </div>
      <div class="verse"><p>خورشید اندر سایه‌اش افزون شده سرمایه‌اش</p><p>صد ماه اندر خرمنش چون نسر طایر دانه چین</p></div>
      <svg class="ring"><path id="track" class="track" pathLength="1"/><path id="prog" class="prog" pathLength="1"/></svg>
      <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg></div>
    </div>
    <div class="rack" id="rack"></div>
    <div class="pool" id="pool"></div>
  </section>
</main>

<svg class="fx" aria-hidden="true">
  <g id="fxg" style="opacity:0">
    <ellipse id="spl" opacity=".45"/>
    <path id="st" fill="none" stroke-linecap="round"/>
    <path id="sth" fill="none" stroke="rgba(255,255,255,.5)" stroke-linecap="round" stroke-dasharray="10 14"/>
  </g>
</svg>

<script>
/* ---------- theme ---------- */
(() => {
  const root = document.documentElement, btn = document.getElementById('theme');
  const apply = t => { root.dataset.theme = t; document.getElementById('ic-sun').style.display = t === 'dark' ? '' : 'none'; document.getElementById('ic-moon').style.display = t === 'dark' ? 'none' : ''; };
  apply(matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  btn.onclick = () => apply(root.dataset.theme === 'dark' ? 'light' : 'dark');
  document.getElementById('setup').addEventListener('submit', e => {
    e.preventDefault();
    const n = +new FormData(e.target).get('n');
    document.dispatchEvent(new CustomEvent('kimia:start', { detail: { count: n } })); // hook into the real game here
  });
})();

/* ---------- live preview: the same tubes, rack and pour as the game ---------- */
(() => {
  const $ = s => document.querySelector(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPD = .75;
  const cs = getComputedStyle(document.documentElement);
  const GW = parseFloat(cs.getPropertyValue('--gw')), GH = parseFloat(cs.getPropertyValue('--gh')), F0 = .64;
  const eio = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const tween = (ms, fn, ease = t => t) => new Promise(res => {
    const t0 = performance.now();
    (function f(now) { const t = Math.min(1, Math.max(0, (now - t0) / (ms * SPD))); fn(ease(t), t); t < 1 ? requestAnimationFrame(f) : res(); })(t0);
  });

  const COLORS = ['#8a7be8', '#2f74d6', '#2fc4e6', '#f0967a', '#8fdcaa', '#f28bb8'];
  const SEQ = [0, 0, 2, 3];                  // which colours land in the 4 slots
  const card = $('#card'), fill = $('#fill'), wave = $('#wave'), rack = $('#rack'), pool = $('#pool');
  const prog = $('#prog'), track = $('#track');

  function setLiq(t, th, f) { t._liq.style.transform = `rotate(${-th}deg) translateY(${(0.5 - f) * GH}px)`; t._f = f; }
  function makeTube(c) {
    const b = document.createElement('div'); b.className = 'tube'; b.style.setProperty('--c', c); b._c = c;
    b.innerHTML = '<div class="gw"><div class="glass"><div class="liq"></div><div class="shine"></div></div><div class="rim"></div></div>';
    b._liq = b.querySelector('.liq'); setLiq(b, 0, F0); return b;
  }
  const sources = COLORS.map(c => { const t = makeTube(c), cell = document.createElement('div'); cell.className = 'cell'; cell.appendChild(t); pool.appendChild(cell); return t; });
  const slots = SEQ.map(() => { const s = document.createElement('div'); s.className = 'slot'; rack.appendChild(s); return s; });
  const slotTube = s => s.querySelector('.tube:not(.leaving)');
  const sync = () => slots.forEach(s => { const t = slotTube(s); s.classList.toggle('full', !!t); if (t) s.style.setProperty('--c', t._c); });

  function dropIn(src, slot, ms = 600) {
    const t = makeTube(src._c); t._src = src;
    const a = src.getBoundingClientRect(); slot.appendChild(t); const b = t.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top; slot.classList.add('lift');
    const an = t.animate([{ transform: `translate(${dx}px,${dy}px)` },
      { transform: `translate(${dx*.45}px,${dy*.45-70}px) rotate(${dx>0?-5:5}deg)`, offset: .5 },
      { transform: 'translate(0,6px)', offset: .85 }, { transform: 'translate(0,0)' }], { duration: ms * SPD, easing: 'ease-in-out' });
    an.onfinish = an.oncancel = () => slot.classList.remove('lift');
    sync(); return t;
  }
  function sendBack(t) {
    t.classList.add('leaving'); const slot = t.parentElement;
    const a = t.getBoundingClientRect(), b = t._src.getBoundingClientRect(); const dx = b.left - a.left, dy = b.top - a.top;
    slot.classList.add('lift');
    const an = t.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx*.5}px,${dy*.5-60}px)`, offset: .5 },
      { transform: `translate(${dx}px,${dy}px) scale(.9)`, opacity: 0 }], { duration: 520 * SPD, easing: 'ease-in-out', fill: 'forwards' });
    an.onfinish = () => { t.remove(); slot.classList.remove('lift'); }; sync();
  }

  /* pouring stream */
  const st = $('#st'), sth = $('#sth'), spl = $('#spl'), fxg = $('#fxg');
  function stream(sx, sy, ex, ey, w, color) {
    if (w < .3 || ey - sy < 6) { fxg.style.opacity = 0; return; }
    const d = `M${sx} ${sy} Q ${ex} ${sy} ${ex} ${ey}`;
    st.setAttribute('d', d); st.setAttribute('stroke', color); st.setAttribute('stroke-width', w);
    sth.setAttribute('d', d); sth.setAttribute('stroke-width', Math.max(.8, w * .32)); sth.style.strokeDashoffset = -(performance.now() / 10) % 240;
    spl.setAttribute('cx', ex); spl.setAttribute('cy', ey); spl.setAttribute('rx', w * 2 + 4); spl.setAttribute('ry', w * .7 + 1.5); spl.setAttribute('fill', color);
    fxg.style.opacity = 1;
  }
  const setSurface = (h, c) => { wave.style.bottom = (h - 9) + 'px'; wave.style.color = c; };

  async function pourOne(t, i, n, band, per, cur0) {
    const color = t._c, cell = t.parentElement; cell.classList.add('lift');
    const r = t.querySelector('.gw').getBoundingClientRect(), px = r.left + GW / 2, py = r.top;
    const bx = card.getBoundingClientRect();
    const Tx = bx.left + bx.width * .5 + 80 + (i - (n - 1) / 2) * 8, Ty = bx.top - 26;
    const dx = Tx - px, dy = Ty - py, f0 = t._f;
    const pose = (e, th, f) => { t.style.transform = `translate(${dx*e}px,${dy*e}px) rotate(${th}deg)`; setLiq(t, th, f); };
    const lip = th => [Tx + (GW/2) * Math.cos(th * Math.PI / 180), Ty + (GW/2) * Math.sin(th * Math.PI / 180)];
    await tween(720, e => pose(e, 20 * e, f0), eio);
    const f1 = f0 * .52;
    await tween(600, e => {
      const th = 20 + 84 * e; pose(1, th, f0 - (f0 - f1) * e * e);
      const fl = Math.max(0, (e - .78) / .22);
      if (fl > 0) { const [sx, sy] = lip(th); stream(sx, sy, sx + 22, bx.bottom - cur0 - 1, 1.4 + 1.8 * fl, color); }
    }, eio);
    await tween(1400, p => {
      const th = 104 + 22 * p; pose(1, th, f1 * (1 - p));
      const grow = per * p; band.style.height = grow + 'px'; setSurface(cur0 + grow, color);
      const [sx, sy] = lip(th), k = Math.min(1, (1 - p) * 8);
      stream(sx, sy, sx + 20, bx.bottom - (cur0 + grow), (1.8 + 3.4 * Math.sqrt(1 - p)) * k, color);
    });
    fxg.style.opacity = 0; band.style.height = per + 'px'; setSurface(cur0 + per, color);
    return tween(700, e => pose(1 - e, 126 * (1 - e), .02), eio).then(() => { t.style.transform = ''; setLiq(t, 0, .03); cell.classList.remove('lift'); });
  }

  /* ring */
  function layoutRing() {
    const w = card.offsetWidth, h = card.offsetHeight, r = 22, o = 1.25, q = r - o;
    const d = `M ${w/2} ${h-o} L ${w-r} ${h-o} A ${q} ${q} 0 0 0 ${w-o} ${h-r} L ${w-o} ${r} A ${q} ${q} 0 0 0 ${w-r} ${o} L ${r} ${o} A ${q} ${q} 0 0 0 ${o} ${r} L ${o} ${h-r} A ${q} ${q} 0 0 0 ${r} ${h-o} L ${w/2} ${h-o}`;
    prog.setAttribute('d', d); track.setAttribute('d', d);
  }
  new ResizeObserver(layoutRing).observe(card);
  const setP = p => { prog.style.opacity = p > 0 ? 1 : 0; prog.style.strokeDashoffset = 1 - p; };

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = cols => `rgb(${cols.map(hex).reduce((a, c) => a.map((v, k) => v + c[k]), [0,0,0]).map(v => Math.round(v / cols.length))})`;

  /* pause when off-screen or tab hidden */
  let paused = false;
  new IntersectionObserver(e => paused = !e[0].isIntersecting).observe(card);
  document.addEventListener('visibilitychange', () => paused = document.hidden);
  const gate = async () => { while (paused) await sleep(300); };

  async function cycle() {
    await gate();
    tween(3600, e => setP(e));                         // rhythm plays: border fills
    const placed = [];
    for (let i = 0; i < SEQ.length; i++) { placed.push(dropIn(sources[SEQ[i]], slots[i])); await sleep(560 * SPD); }
    await sleep(900 * SPD); await gate();
    wave.style.opacity = .85;
    const per = card.getBoundingClientRect().height * .9 / placed.length; let last;
    for (let i = 0; i < placed.length; i++) {
      const band = document.createElement('div'); band.className = 'band'; band.style.setProperty('--c', placed[i]._c); fill.appendChild(band);
      const p = pourOne(placed[i], i, placed.length, band, per, i * per);
      last = p;
      await new Promise(r => { p.then(r); setTimeout(r, 2900 * SPD); });   // next tube starts while this one returns
      await gate();
    }
    await last;
    wave.style.color = mix(placed.map(t => t._c)); fill.style.filter = 'blur(24px) saturate(1.25)';
    await sleep(2600); await gate();
    fill.style.transition = 'opacity .6s'; fill.style.opacity = 0; wave.style.opacity = 0; setP(0);
    placed.forEach((t, k) => setTimeout(() => sendBack(t), k * 90));
    await sleep(1300);
    fill.innerHTML = ''; fill.style.transition = ''; fill.style.opacity = ''; fill.style.filter = '';
    await sleep(700);
  }

  async function staticFrame() {                      // reduced motion: show the finished state once
    layoutRing(); setP(1);
    SEQ.forEach((c, i) => { const t = dropIn(sources[c], slots[i], 1); });
    const per = card.getBoundingClientRect().height * .9 / SEQ.length;
    SEQ.forEach((c, i) => { const b = document.createElement('div'); b.className = 'band'; b.style.setProperty('--c', COLORS[c]); b.style.height = per + 'px'; fill.appendChild(b); });
    fill.style.filter = 'blur(24px) saturate(1.25)';
  }

  (async () => {
    await (document.fonts ? document.fonts.ready : Promise.resolve());
    if (RM) return staticFrame();
    layoutRing();
    while (true) await cycle();
  })();
})();
</script>
