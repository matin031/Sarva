# سروا — کل استک.
#
# هدف این فایل یک جمله است: روی سرور بعدی، `docker compose up -d` تنها کاری
# باشد که لازم است. پس هیچ مقداری اینجا هاردکد نشده و همه از .env می‌آید،
# و مهاجرت دیتابیس هم داخل entrypoint اپ است نه یک مرحلهٔ دستی.

name: sarva

# چرخش لاگ — یک بار تعریف، سه بار استفاده.
#
# ⚠️ چرا لازم است: درایور پیش‌فرض داکر `json-file` **بدون سقف** است. یعنی
# لاگِ یک سرویسِ پرحرف تا وقتی دیسک پر شود بزرگ می‌شود، و آن‌وقت پستگرس هم
# دیگر جایی برای نوشتن ندارد. این اتفاق ماه‌ها بعد از راه‌اندازی می‌افتد،
# درست وقتی کسی به آن فکر نمی‌کند.
#
# json-file نگه داشته شده و درایور دیگری انتخاب نشده، چون `docker compose logs`
# فقط با همین (و local) کار می‌کند — و آن دستور تنها راهِ دیدنِ لاگ برای کسی
# است که با سرور کار نمی‌کند.
#
# ۱۰ مگابایت × ۵ فایل = حداکثر ۵۰ مگابایت به ازای هر سرویس.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    # پستگرس عمداً پرحرف‌تر نمی‌شود؛ فقط سقفِ همان لاگِ پیش‌فرض گذاشته شده.
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER لازم است}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB لازم است}
      # وگرنه initdb با لوکیل سیستم بالا می‌آید و مرتب‌سازیِ متن فارسی بین
      # ماشین‌ها فرق می‌کند — یعنی همان کوئری روی سرور و لپ‌تاپ ترتیب متفاوت
      # می‌دهد. با C.UTF-8 رفتار همه‌جا یکی است.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # فقط روی لوپ‌بک، و فقط برای وصل شدن با یک کلاینت گرافیکی. روی سرورِ
    # عمومی این خط را از .env خالی بگذارید تا اصلاً منتشر نشود.
    ports:
      - "${POSTGRES_EXPOSE:-127.0.0.1:5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # لاگ ساختاریافتهٔ اپ فقط به stdout/stderr می‌رود (هیچ فایلی داخل کانتینر
    # ساخته نمی‌شود)، پس چرخش کارِ همین چند خط است.
    logging: *default-logging
    depends_on:
      db:
        # نه فقط «شروع شده» — پستگرس چند ثانیه بعد از start تازه آمادهٔ اتصال
        # می‌شود، و migration ای که زودتر بزند با ECONNREFUSED می‌میرد.
        condition: service_healthy
    env_file:
      - .env
    environment:
      # داخل شبکهٔ compose، هاستِ دیتابیس نام سرویس است. این تنها جایی است که
      # DATABASE_URL ساخته می‌شود تا در .env تکرار نشود و از هم نیفتند.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOADS_DIR: /app/uploads
      # خروجی لاگ در کانتینر همیشه JSON است، حتی اگر NODE_ENV جور دیگری تنظیم
      # شود — یک خط JSON با grep و jq قابل کار است، متنِ رنگی نه.
      LOG_FORMAT: json
    volumes:
      # فایل‌های آپلودی باید از بازسازی کانتینر جان سالم به در ببرند. همین
      # volume با :ro به caddy هم داده می‌شود تا مستقیم سروشان کند.
      - uploads:/app/uploads
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      # گواهی‌های TLS. بدون این volume، هر بار restart یک گواهی تازه از
      # Let's Encrypt گرفته می‌شود و خیلی زود به سقف نرخ می‌خورید.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
