<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کیمیای وزن — نمونهٔ طراحی جدید</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a13; --edge:rgba(150,190,255,.14); --ink:#e9eff9; --mute:#8a99b2;
  --acc:#22d3c5; --gw:46px; --gh:112px; --cw:68px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink);
  font-family:'Vazirmatn',system-ui,sans-serif;
  background:radial-gradient(1100px 520px at 50% -120px,#12233f 0%,transparent 70%),var(--bg);
}
.top{
  max-width:1100px; margin:18px auto 0; padding:12px 22px;
  display:flex; justify-content:space-between; align-items:center;
  border:1px solid var(--edge); border-radius:18px; color:var(--mute); font-size:14px;
}
.top a{color:var(--mute); text-decoration:none}
main{max-width:1120px; margin:30px auto 60px; padding:0 16px; display:flex; flex-direction:column; align-items:center}

/* ---------- verse card ---------- */
.card{
  position:relative; width:min(680px,100%); margin-bottom:58px; border-radius:24px;
  background:linear-gradient(180deg,#0f1c33,#0a1222); border:1px solid var(--edge);
  transition:border-color .6s, box-shadow .6s;
}
.vessel{position:absolute; inset:0; border-radius:inherit; overflow:hidden}
.fill{
  position:absolute; left:-18px; right:-18px; bottom:-18px; padding-bottom:18px;
  display:flex; flex-direction:column-reverse;
  filter:blur(7px) saturate(1.15); opacity:.62;
  transition:filter 1.8s ease, opacity .8s;
}
.band{flex:none; height:0; background:var(--c)}
.wave{position:absolute; left:0; width:100%; height:18px; bottom:-40px; overflow:hidden; opacity:0; color:#fff; transition:opacity .4s,color 1.6s}
.wave svg{position:absolute; left:0; top:0; width:200%; height:100%; animation:slosh 5s linear infinite}
.wave path{fill:currentColor; opacity:.7}
@keyframes slosh{to{transform:translateX(-50%)}}

.verse{
  position:relative; z-index:2; padding:42px 34px 60px; text-align:center;
  font-size:clamp(20px,3.2vw,31px); line-height:2.15; font-weight:600;
  text-shadow:0 2px 14px rgba(0,0,0,.65);
}
.verse p{margin:0}

.ring{position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:visible}
.ring path{fill:none; stroke-width:2.5; stroke-linecap:round}
.track{stroke:rgba(255,255,255,.07)}
.prog{stroke:var(--acc); stroke-dasharray:1 1; stroke-dashoffset:1; opacity:0; filter:drop-shadow(0 0 5px var(--acc))}
.prog.done{stroke:#5cf0a0; filter:drop-shadow(0 0 6px #5cf0a0)}

.play{
  position:absolute; z-index:6; left:50%; bottom:-32px; translate:-50% 0;
  width:64px; height:64px; border-radius:50%; border:0; cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#54f2e4,#0e9f9a);
  box-shadow:0 8px 26px rgba(34,211,197,.35),0 0 0 6px var(--bg);
  display:grid; place-items:center; transition:transform .2s;
}
.play:hover{transform:scale(1.06)}
.play:active{transform:scale(.96)}
.play svg{width:24px; height:24px; fill:#03302d}
.play:focus-visible,.btn:focus-visible,.tube:focus-visible .gw{outline:2px solid #fff; outline-offset:4px}

.card.ok{border-color:rgba(92,240,160,.5); box-shadow:0 0 44px rgba(92,240,160,.16)}
.card.bad{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- rack ---------- */
.rack{
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  padding:26px 24px 18px; border-radius:28px; position:relative;
  background:linear-gradient(180deg,#0b1424,#0d182b); border:1px solid var(--edge);
  box-shadow:inset 0 -18px 30px rgba(0,0,0,.35);
}
.slot{position:relative; width:var(--cw); height:calc(var(--gh) + 58px)}
.slot::before{
  content:attr(data-n); position:absolute; left:11px; top:0; width:var(--gw); height:var(--gh);
  border:1.5px dashed rgba(255,255,255,.16); border-radius:8px 8px 26px 26px;
  display:grid; place-items:center; color:rgba(255,255,255,.22); font-size:16px; transition:opacity .3s;
}
.slot.full::before{opacity:0}
.slot::after{ /* front lip of the socket: tube "sinks" behind it */
  content:''; position:absolute; left:0; right:0; top:calc(var(--gh) - 16px); height:22px; z-index:4;
  border-radius:0 0 14px 14px; border:1px solid rgba(150,190,255,.18); border-top-color:rgba(255,255,255,.22);
  background:linear-gradient(180deg,#1b2b46,#0e1830);
  transition:opacity .25s, box-shadow .5s;
}
.slot.full::after{box-shadow:0 10px 26px -6px var(--c)}
.slot.lift::after{opacity:0}

.count{margin:16px 0 0; color:var(--mute); font-size:14px; min-height:22px; text-align:center}

/* ---------- pool ---------- */
.pool{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 0; margin-top:22px}
.cell{position:relative; width:var(--cw); height:calc(var(--gh) + 56px)}
.cell::before{
  content:''; position:absolute; left:11px; top:0; width:var(--gw); height:var(--gh);
  border-radius:8px 8px 26px 26px; border:1.5px dashed rgba(255,255,255,.07); opacity:0; transition:opacity .3s;
}
.cell.empty::before{opacity:1}
.lift{z-index:50}

/* ---------- test tube ---------- */
.tube{
  position:relative; z-index:1; display:block; width:var(--cw); padding:0; border:0; background:none;
  color:inherit; font:inherit; cursor:pointer; transform-origin:34px 0; -webkit-tap-highlight-color:transparent;
}
.gw{position:relative; width:var(--gw); height:var(--gh); margin:0 auto; transition:translate .25s}
.pool .tube:hover .gw{translate:0 -6px}
.glass{
  position:absolute; inset:0; overflow:hidden; border-radius:4px 4px 26px 26px;
  border:1.5px solid rgba(255,255,255,.28); border-top:0;
  background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 40%,rgba(255,255,255,.06));
}
.liq{
  position:absolute; left:50%; top:50%; width:400px; height:400px; margin-left:-200px; transform-origin:200px 0;
  background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 35%,rgba(0,0,0,.22)),var(--c);
}
.liq::before{content:''; position:absolute; left:0; right:0; top:0; height:5px; background:rgba(255,255,255,.35)}
.shine{position:absolute; left:8px; top:8px; bottom:24px; width:5px; border-radius:5px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.rim{position:absolute; left:-4px; right:-4px; top:-3px; height:6px; border-radius:4px; background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.18))}
.lbl{margin-top:10px; text-align:center; font-size:13px; line-height:1.35; transition:opacity .2s}
.lbl b{display:block; font-weight:600}
.lbl i{font-style:normal; color:var(--mute); font-size:12px; letter-spacing:.06em; white-space:nowrap}
.tube.pouring .lbl{opacity:0}
body.busy .tube{pointer-events:none}

/* ---------- actions ---------- */
.actions{display:flex; gap:12px; margin-top:22px}
.btn{font:inherit; font-weight:600; padding:12px 32px; border-radius:14px; border:1px solid var(--edge); background:transparent; color:var(--ink); cursor:pointer; transition:.2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.05)}
.btn.primary{background:linear-gradient(180deg,#2be0d2,#12a8a2); color:#03302d; border-color:transparent; box-shadow:0 8px 24px -8px rgba(34,211,197,.6)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); background:linear-gradient(180deg,#2be0d2,#12a8a2)}
.btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none}

.fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:80}

@media (prefers-reduced-motion:reduce){ .wave svg{animation:none} }
</style>
</head>
<body>

<header class="top">
  <a href="#">← بازی‌ها</a>
  <span id="idx">بیت ۱ از ۲</span>
  <span style="width:60px"></span>
</header>

<main>
  <!-- verse box: the liquid is poured into this box -->
  <section class="card" id="card" aria-label="بیت">
    <div class="vessel">
      <div class="fill" id="fill"></div>
      <div class="wave" id="wave">
        <svg viewBox="0 0 400 18" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 9 Q25 1 50 9 T100 9 T150 9 T200 9 T250 9 T300 9 T350 9 T400 9 V18 H0Z"/>
        </svg>
      </div>
    </div>
    <div class="verse"><p id="l1"></p><p id="l2"></p></div>

    <!-- border that fills while the rhythm plays -->
    <svg class="ring" aria-hidden="true">
      <path id="track" class="track" pathLength="1"/>
      <path id="prog" class="prog" pathLength="1"/>
    </svg>

    <button class="play" id="play" aria-label="پخش ریتم این بیت">
      <svg id="ic-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
      <svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
    </button>
  </section>

  <!-- rack: exactly as many sockets as the verse has arkan -->
  <div class="rack" id="rack" aria-label="جایگاه ارکان"></div>
  <p class="count" id="count" aria-live="polite"></p>

  <div class="pool" id="pool"></div>

  <div class="actions">
    <button class="btn" id="clr">از نو</button>
    <button class="btn primary" id="go">ترکیب</button>
  </div>
</main>

<!-- pouring stream overlay -->
<svg class="fx" aria-hidden="true">
  <g id="fxg" style="opacity:0">
    <ellipse id="spl" opacity=".45"/>
    <path id="st" fill="none" stroke-linecap="round"/>
    <path id="sth" fill="none" stroke="rgba(255,255,255,.5)" stroke-linecap="round" stroke-dasharray="10 14"/>
  </g>
</svg>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const fa = n => n.toLocaleString('fa-IR');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPD = RM ? .35 : 1;
  const GW = 46, GH = 112, F0 = .64;
  const eio = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const lin = t => t;

  function tween(ms, fn, ease = lin) {
    return new Promise(res => {
      const t0 = performance.now();
      (function f(now) {
        const t = Math.min(1, Math.max(0, (now - t0) / (ms * SPD)));
        fn(ease(t), t);
        t < 1 ? requestAnimationFrame(f) : res();
      })(t0);
    });
  }

  /* ---------- data (replace with your real data) ---------- */
  // L = long syllable, S = short syllable
  const RUKN = [
    ['فع','L','#ecd28c'], ['فعل','SL','#cf7419'], ['مفعول','LLS','#f0967a'], ['فاعلن','LSL','#c94a48'],
    ['فعولن','SLL','#f28bb8'], ['فعلن','SSL','#b84f88'], ['مستفعلن','LLSL','#d38bea'], ['فاعلاتن','LSLL','#8a4fb5'],
    ['فاعلات','LSLS','#9fb0f5'], ['مفتعلن','LSSL','#8a7be8'], ['مفاعیلن','SLLL','#2fc4e6'], ['مفاعیل','SLLS','#2f74d6'],
    ['مفاعلن','SLSL','#8fdcaa'], ['فعلاتن','SSLL','#4fa83d'], ['فعلات','SSLS','#a9b22a'], ['متفاعلن','SSLSL','#8b8555'],
  ];
  const SYM = { L: '–', S: '∪' };
  const VERSES = [
    { a: 'خورشید اندر سایه‌اش افزون شده سرمایه‌اش', b: 'صد ماه اندر خرمنش چون نسر طایر دانه چین',
      ans: ['مستفعلن','مستفعلن','مستفعلن','مستفعلن'], audio: '' },
    { a: 'بشنو از نی چون حکایت می‌کند', b: 'از جدایی‌ها شکایت می‌کند',
      ans: ['فاعلاتن','فاعلاتن','فاعلن'], audio: '' },   // audio: '/path/to/rhythm.mp3'
  ];

  /* ---------- elements & state ---------- */
  const card = $('#card'), fill = $('#fill'), wave = $('#wave'), rack = $('#rack'), pool = $('#pool');
  const count = $('#count'), go = $('#go'), clr = $('#clr');
  let slots = [], verseIdx = 0, busy = false, state = 'idle'; // idle | solved | failed

  /* ---------- tubes ---------- */
  function setLiq(t, th, f) {
    t._liq.style.transform = `rotate(${-th}deg) translateY(${(0.5 - f) * GH}px)`;
    t._f = f;
  }
  function makeTube([n, p, c]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tube'; b.style.setProperty('--c', c);
    b.setAttribute('aria-label', n);
    b.innerHTML = `<div class="gw"><div class="glass"><div class="liq"></div><div class="shine"></div></div><div class="rim"></div></div>
      <div class="lbl"><b>${n}</b><i>${[...p].map(x => SYM[x]).join(' ')}</i></div>`;
    b._liq = b.querySelector('.liq'); b._n = n; b._c = c;
    setLiq(b, 0, F0);
    return b;
  }
  // The tubes in the pool are dispensers: tapping one sends a copy to the rack,
  // so a rukn can be used more than once in a verse (e.g. مستفعلن ×4).
  const sources = RUKN.map(r => {
    const b = makeTube(r);
    const cell = document.createElement('div');
    cell.className = 'cell'; cell.appendChild(b); pool.appendChild(cell);
    return b;
  });
  const slotTube = s => s.querySelector('.tube:not(.leaving)');

  function buildRack(n) {
    rack.innerHTML = ''; slots = [];
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'slot'; s.dataset.n = fa(i + 1);
      rack.appendChild(s); slots.push(s);
    }
  }

  function sync() {
    slots.forEach(s => {
      const t = slotTube(s);
      s.classList.toggle('full', !!t);
      if (t) s.style.setProperty('--c', t._c);
    });
    const filled = slots.filter(slotTube).length;
    const left = slots.length - filled;
    if (state === 'idle' && !busy) {
      count.textContent = left ? `${fa(left)} جایگاه دیگر مانده` : 'همهٔ جایگاه‌ها پر شد. حالا ترکیب کن.';
    }
    go.disabled = busy || (state === 'idle' && left > 0);
    clr.disabled = busy || (state === 'idle' && filled === 0);
  }

  /* a copy of the pool tube drops into a rack socket (FLIP arc) */
  function dropIn(src, slot, ms = 600) {
    const t = makeTube([src._n, RUKN.find(r => r[0] === src._n)[1], src._c]);
    t._src = src;
    const a = src.getBoundingClientRect();
    slot.appendChild(t);
    const b = t.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    slot.classList.add('lift');
    const an = t.animate([
      { transform: `translate(${dx}px,${dy}px)` },
      { transform: `translate(${dx * .45}px,${dy * .45 - 80}px) rotate(${dx > 0 ? -5 : 5}deg)`, offset: .5 },
      { transform: 'translate(0,7px)', offset: .85 },
      { transform: 'translate(0,0)' },
    ], { duration: ms * SPD, easing: 'ease-in-out' });
    an.onfinish = an.oncancel = () => slot.classList.remove('lift');
    t.addEventListener('click', () => {
      if (busy || state !== 'idle') return;
      sendBack(t);
    });
    src.animate([{ transform: 'scale(1)' }, { transform: 'scale(.94)' }, { transform: 'scale(1)' }], { duration: 260 });
    sync();
  }

  /* a rack tube flies back to its dispenser and disappears */
  function sendBack(t) {
    t.classList.add('leaving');
    const slot = t.parentElement;
    const a = t.getBoundingClientRect(), b = t._src.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    slot.classList.add('lift');
    const an = t.animate([
      { transform: 'translate(0,0)' },
      { transform: `translate(${dx * .5}px,${dy * .5 - 70}px) rotate(${dx > 0 ? 6 : -6}deg)`, offset: .5 },
      { transform: `translate(${dx}px,${dy}px) scale(.9)`, opacity: 0 },
    ], { duration: 520 * SPD, easing: 'ease-in-out', fill: 'forwards' });
    an.onfinish = () => { t.remove(); slot.classList.remove('lift'); };
    sync();
  }

  sources.forEach(src => src.addEventListener('click', () => {
    if (busy || state !== 'idle') return;
    const s = slots.find(s => !slotTube(s));
    if (s) dropIn(src, s);
  }));

  /* ---------- pouring ---------- */
  const st = $('#st'), sth = $('#sth'), spl = $('#spl'), fxg = $('#fxg');
  function stream(sx, sy, ex, ey, w, color) {
    if (w < .3 || ey - sy < 6) { fxg.style.opacity = 0; return; }
    const d = `M${sx} ${sy} Q ${ex} ${sy} ${ex} ${ey}`;
    st.setAttribute('d', d); st.setAttribute('stroke', color); st.setAttribute('stroke-width', w);
    sth.setAttribute('d', d); sth.setAttribute('stroke-width', Math.max(.8, w * .32));
    sth.style.strokeDashoffset = -(performance.now() / 10) % 240;
    spl.setAttribute('cx', ex); spl.setAttribute('cy', ey);
    spl.setAttribute('rx', w * 2 + 4); spl.setAttribute('ry', w * .7 + 1.5); spl.setAttribute('fill', color);
    fxg.style.opacity = 1;
  }
  const hideStream = () => fxg.style.opacity = 0;
  function setSurface(h, color) { wave.style.bottom = (h - 9) + 'px'; wave.style.color = color; }

  async function pourOne(t, i, n, band, per, cur0) {
    const color = t._c, cell = t.parentElement;
    cell.classList.add('lift'); t.classList.add('pouring');
    const r = t.querySelector('.gw').getBoundingClientRect();
    const px = r.left + GW / 2, py = r.top;
    const bx = card.getBoundingClientRect();
    const Tx = bx.left + bx.width * .5 + 70 + (i - (n - 1) / 2) * 8, Ty = bx.top - 34;
    const dx = Tx - px, dy = Ty - py, f0 = t._f;
    const pose = (e, th, f) => { t.style.transform = `translate(${dx * e}px,${dy * e}px) rotate(${th}deg)`; setLiq(t, th, f); };
    const lip = th => [Tx + (GW / 2) * Math.cos(th * Math.PI / 180), Ty + (GW / 2) * Math.sin(th * Math.PI / 180)];

    // 1) lift & travel above the verse box
    await tween(720, e => pose(e, 20 * e, f0), eio);
    // 2) tilt until the liquid reaches the rim
    const f1 = f0 * .52;
    await tween(600, e => {
      const th = 20 + 84 * e, f = f0 - (f0 - f1) * e * e;
      pose(1, th, f);
      const fl = Math.max(0, (e - .78) / .22);
      if (fl > 0) { const [sx, sy] = lip(th); stream(sx, sy, sx + 26, bx.bottom - cur0 - 1, 1.5 + 2 * fl, color); }
    }, eio);
    // 3) pour
    await tween(1500, p => {
      const th = 104 + 22 * p, f = f1 * (1 - p);
      pose(1, th, f);
      const grow = per * p;
      band.style.height = grow + 'px'; setSurface(cur0 + grow, color);
      const [sx, sy] = lip(th);
      const k = Math.min(1, (1 - p) * 8);
      stream(sx, sy, sx + 24, bx.bottom - (cur0 + grow), (2 + 4 * Math.sqrt(1 - p)) * k, color);
    });
    hideStream();
    band.style.height = per + 'px'; setSurface(cur0 + per, color);
    // 4) go back to the rack (not awaited: next tube starts meanwhile)
    const back = tween(700, e => pose(1 - e, 126 * (1 - e), .02), eio).then(() => {
      t.style.transform = ''; setLiq(t, 0, .03); t.classList.remove('pouring'); cell.classList.remove('lift');
    });
    return { back };
  }

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  async function combine() {
    busy = true; document.body.classList.add('busy'); sync();
    count.textContent = 'در حال ترکیب…';
    const order = slots.map(slotTube);
    const n = order.length, per = card.getBoundingClientRect().height * .9 / n;
    wave.style.opacity = .85;
    let last;
    for (let i = 0; i < n; i++) {
      const band = document.createElement('div');
      band.className = 'band'; band.style.setProperty('--c', order[i]._c); fill.appendChild(band);
      last = await pourOne(order[i], i, n, band, per, i * per);
    }
    await last.back;
    await sleep(300 * SPD);

    // mix: the hard layers dissolve into one blend
    const avg = order.map(t => hex(t._c)).reduce((a, c) => a.map((v, k) => v + c[k]), [0, 0, 0]).map(v => Math.round(v / n));
    wave.style.color = `rgb(${avg})`;
    fill.style.filter = 'blur(24px) saturate(1.25)';
    await sleep(1700 * SPD);

    const ok = order.every((t, i) => t._n === VERSES[verseIdx].ans[i]);
    busy = false; document.body.classList.remove('busy');
    if (ok) {
      state = 'solved'; card.classList.add('ok');
      prog.classList.add('done'); setP(1);
      count.textContent = 'آفرین! وزن این بیت درست چیده شد.';
      go.textContent = 'بیت بعدی';
    } else {
      state = 'failed'; card.classList.add('bad');
      fill.style.filter = 'blur(24px) grayscale(.8) brightness(.75)';
      count.textContent = 'ترتیب ارکان درست نبود. از نو امتحان کن.';
    }
    sync();
  }

  async function reset() {
    busy = true; sync(); stopPlay();
    fill.style.transition = 'opacity .6s'; fill.style.opacity = 0; wave.style.opacity = 0;
    card.classList.remove('ok', 'bad'); prog.classList.remove('done'); setP(0);
    const inSlots = slots.map(slotTube).filter(Boolean);
    inSlots.forEach((t, k) => setTimeout(() => sendBack(t), k * 90 * SPD));
    await sleep(700 * SPD + inSlots.length * 90 * SPD);
    fill.innerHTML = ''; fill.style.transition = ''; fill.style.opacity = ''; fill.style.filter = '';
    state = 'idle'; busy = false; go.textContent = 'ترکیب'; sync();
  }

  function loadVerse() {
    const v = VERSES[verseIdx];
    $('#l1').textContent = v.a; $('#l2').textContent = v.b;
    $('#idx').textContent = `بیت ${fa(verseIdx + 1)} از ${fa(VERSES.length)}`;
    buildRack(v.ans.length); setupAudio(v); sync();
  }

  go.onclick = async () => {
    if (state === 'solved') { verseIdx = (verseIdx + 1) % VERSES.length; await reset(); loadVerse(); }
    else if (state === 'idle') combine();
    else reset();
  };
  clr.onclick = reset;

  /* ---------- rhythm player: border fills while playing ---------- */
  const prog = $('#prog'), track = $('#track'), playBtn = $('#play');
  let audio = null, playing = false, pt = 0, raf = 0, lastT = 0;
  const DUR = 7000; // simulated length when no audio file is given

  function layoutRing() {
    const w = card.offsetWidth, h = card.offsetHeight, r = 24, o = 1.25, q = r - o;
    // starts under the play button, runs in reading direction (right → left)
    const d = `M ${w/2} ${h-o} L ${w-r} ${h-o} A ${q} ${q} 0 0 0 ${w-o} ${h-r} L ${w-o} ${r} A ${q} ${q} 0 0 0 ${w-r} ${o}
      L ${r} ${o} A ${q} ${q} 0 0 0 ${o} ${r} L ${o} ${h-r} A ${q} ${q} 0 0 0 ${r} ${h-o} L ${w/2} ${h-o}`;
    prog.setAttribute('d', d); track.setAttribute('d', d);
  }
  new ResizeObserver(layoutRing).observe(card);

  function setP(p) { prog.style.opacity = p > 0 ? 1 : 0; prog.style.strokeDashoffset = 1 - p; }
  function setIcon() { $('#ic-play').style.display = playing ? 'none' : ''; $('#ic-pause').style.display = playing ? '' : 'none'; }
  function setupAudio(v) {
    stopPlay(); audio = null;
    if (v.audio) {
      audio = new Audio(v.audio);
      audio.addEventListener('timeupdate', () => setP(audio.currentTime / (audio.duration || 1)));
      audio.addEventListener('ended', finish);
    }
  }
  function startPlay() {
    if (state !== 'idle') return;
    playing = true; setIcon();
    if (audio) audio.play(); else { lastT = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function pausePlay() { playing = false; setIcon(); if (audio) audio.pause(); cancelAnimationFrame(raf); }
  function stopPlay() { pausePlay(); if (audio) audio.currentTime = 0; pt = 0; setP(0); }
  function tick(now) {
    pt += now - lastT; lastT = now;
    if (pt >= DUR) { setP(1); finish(); return; }
    setP(pt / DUR); raf = requestAnimationFrame(tick);
  }
  function finish() {
    playing = false; setIcon(); pt = 0;
    setTimeout(() => {
      if (playing) return;
      prog.style.transition = 'stroke-dashoffset .7s ease'; setP(0);
      setTimeout(() => prog.style.transition = '', 800);
    }, 500);
  }
  playBtn.onclick = () => playing ? pausePlay() : startPlay();

  loadVerse();
})();
</script>
</body>
</html>
